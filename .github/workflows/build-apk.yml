name: Build Android APK (Nghia MMO ALLDOWNLOAD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare Signed APK Output
        working-directory: android
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" output/Nghia-MMO-ALLDOWNLOAD.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-MMO-ALLDOWNLOAD-APK
          path: android/output/Nghia-MMO-ALLDOWNLOAD.apk
          if-no-files-found: error
