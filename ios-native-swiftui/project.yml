name: ALLDOWN
options:
  bundleIdPrefix: com.nghiammo
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  ALLDOWN:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ALLDOWNApp.swift
      - path: Shared
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nghiammo.alldown
        PRODUCT_NAME: ALLDOWN
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "20"
    dependencies:
      - target: ALLDOWNShareExtension
        embed: true

  ALLDOWNShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ShareExtension/ShareViewController.swift
      - path: Shared
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nghiammo.alldown.ShareExtension
        PRODUCT_NAME: ALLDOWNShareExtension
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "20"
        SKIP_INSTALL: YES
